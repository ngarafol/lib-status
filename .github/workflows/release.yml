name: Release

# Novi tag (npr. v0.1.4) => testovi, pa GitHub release bez ručnog klikanja.
# Workflow se čita iz tagiranog commita, pa tag mora sadržavati ovu datoteku.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: Testovi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Instaliraj testnu okolinu
        run: pip install -r requirements_test.txt

      - name: Pusti testove
        run: pytest tests/ -q --timeout=120

  release:
    name: Release
    needs: test # release samo ako su testovi prošli
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # da poruka taga bude dostupna

      - name: Usporedi tag s verzijom u manifestu
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(grep -o '"version": "[^"]*"' \
            custom_components/knjiznica_metelgrad/manifest.json | cut -d'"' -f4)
          echo "tag=$tag manifest=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::warning::Tag $tag i manifest.json ($manifest) se ne poklapaju — HACS prikazuje verziju iz manifesta."
          fi

      - name: Stvori release iz poruke taga
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag već postoji — preskačem."
            exit 0
          fi
          notes=$(git tag -l --format='%(contents)' "$tag")
          gh release create "$tag" --title "$tag" --notes "${notes:-Release $tag}"
