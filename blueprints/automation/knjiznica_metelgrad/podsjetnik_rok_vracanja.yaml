blueprint:
  name: "Knjižnica Metelgrad: podsjetnik s produženjem"
  description: >-
    Svaki dan u zadano vrijeme provjeri rokove i pošalje notifikaciju kad neka
    knjiga ulazi u zadani prozor. Uz notifikaciju idu gumbi "Produži" za svaku
    knjigu u prozoru (do 3, koliko mobilne aplikacije prikazuju): klik pošalje
    zahtjev za produženje baš te knjige i javi rezultat.

    Način rada biraš s "Ponavljaj svaki dan": uključeno = podsjetnik svaki dan
    dok je rok u prozoru, isključeno = samo jednom, točno zadani broj dana prije
    roka.
  domain: automation
  input:
    loans_entity:
      name: Senzor posudbi
      description: Senzor "Posudbe" integracije Knjižnica Metelgrad.
      selector:
        entity:
          domain: sensor
          integration: knjiznica_metelgrad
          multiple: false
    days_before:
      name: Broj dana prije roka
      description: Koliko dana prije roka se šalje podsjetnik.
      default: 3
      selector:
        number:
          min: 1
          max: 21
          unit_of_measurement: dana
          mode: box
    repeat_daily:
      name: Ponavljaj svaki dan
      description: >-
        Uključeno: podsjetnik svaki dan dok je rok unutar zadanog broja dana.
        Isključeno: samo jedan podsjetnik, točno zadani broj dana prije roka.
      default: true
      selector:
        boolean:
    notify_time:
      name: Vrijeme provjere
      description: U koliko sati se provjerava (svaki dan).
      default: "09:00:00"
      selector:
        time:
    notify_service:
      name: Notifikacijska usluga
      description: "npr. notify.mobile_app_moj_telefon"
      selector:
        text:
    notify_title:
      name: Naslov notifikacije
      default: "📚 Knjižnica: rok vraćanja"
      selector:
        text:

# `variables` su dostupne u uvjetima i radnjama (ali ne u okidačima). `due_window`
# mora završiti kao popis — tests/test_blueprint.py to provjerava.
variables:
  loans_entity: !input loans_entity
  days_before: !input days_before
  repeat_daily: !input repeat_daily
  due_window: >-
    {% set today = now().date().isoformat() %}
    {% set limit = (now() + timedelta(days=days_before)).date().isoformat() %}
    {% set window_start = today if repeat_daily else limit %}
    {{ (state_attr(loans_entity, 'loans') or [])
       | selectattr('due_on')
       | selectattr('due_on', 'ge', window_start)
       | selectattr('due_on', 'le', limit) | list }}

mode: single

triggers:
  - trigger: time
    at: !input notify_time
  - trigger: event
    event_type: mobile_app_notification_action

actions:
  - choose:
      # 1) Klik na "Produži" u notifikaciji — produži baš tu knjigu.
      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.platform == 'event'
                 and trigger.event.data.action is defined
                 and trigger.event.data.action[:7] == 'RENEW: ' }}
        sequence:
          - variables:
              loan_title: "{{ trigger.event.data.action[7:] }}"
          - action: knjiznica_metelgrad.renew
            data:
              loan: "{{ loan_title }}"
            response_variable: rezultat
          - action: !input notify_service
            data:
              title: !input notify_title
              message: >-
                {% if rezultat.failed %}
                Produženje nije poslano za: {{ loan_title }}.
                {% else %}
                Zahtjev za produženje poslan: {{ loan_title }}.
                {% endif %}

      # 2) Dnevni podsjetnik s gumbima za produženje.
      - conditions:
          - condition: template
            value_template: "{{ trigger.platform == 'time' and due_window | count > 0 }}"
        sequence:
          - action: !input notify_service
            data:
              title: !input notify_title
              message: >-
                {% set titles = due_window | map(attribute='title') | list %}
                {% set due = due_window | map(attribute='due_on') | list | sort | first %}
                Bliži se rok vraćanja ({{ due }}): {{ titles | join(', ') }}.
              data:
                actions: >-
                  {% set ns = namespace(items=[]) %}
                  {% for loan in due_window[:3] %}
                  {% set ns.items = ns.items + [{'action': 'RENEW: ' ~ loan.title,
                                                 'title': 'Produži: ' ~ loan.title}] %}
                  {% endfor %}
                  {{ ns.items }}
